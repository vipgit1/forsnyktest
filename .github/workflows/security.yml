name: security

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SEVERITY: critical        # low | medium | high | critical

    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      # --- Open source dependencies (SCA) ---
      - name: Snyk Open Source
        id: oss
        run: snyk test --all-projects --severity-threshold=$SEVERITY --sarif-file-output=snyk-oss.sarif
        continue-on-error: true

      # --- Code analysis (SAST) ---
      - name: Snyk Code
        id: code
        run: snyk code test --severity-threshold=$SEVERITY --sarif-file-output=snyk-code.sarif
        continue-on-error: true

      - name: Report summary
        if: always()
        run: |
          echo "## Snyk scan report" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Error (High/Critical) | Warning (Medium) | Note (Low) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in snyk-oss snyk-code; do
            if [ -f $f.sarif ]; then
              e=$(jq '[.runs[].results[]? | select(.level=="error")] | length' $f.sarif)
              w=$(jq '[.runs[].results[]? | select(.level=="warning")] | length' $f.sarif)
              n=$(jq '[.runs[].results[]? | select(.level=="note")] | length' $f.sarif)
              echo "| $f | $e | $w | $n |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      # --- Upload results (separate categories so one doesn't overwrite the other) ---
      - name: Upload Snyk Open Source results
        if: always() && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-open-source

      - name: Upload Snyk Code results
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

                - name: Post PR summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const count = (file) => {
              if (!fs.existsSync(file)) return null;
              const results = JSON.parse(fs.readFileSync(file, 'utf8')).runs
                .flatMap(r => r.results || []);
              return {
                high: results.filter(r => r.level === 'error').length,
                medium: results.filter(r => r.level === 'warning').length,
                low: results.filter(r => r.level === 'note').length,
              };
            };
            const row = (name, c) => c
              ? `| ${name} | ${c.high} | ${c.medium} | ${c.low} |`
              : `| ${name} | n/a | n/a | n/a |`;
            const body = [
              '## Snyk security summary',
              '',
              '| Scan | High/Critical | Medium | Low |',
              '|---|---|---|---|',
              row('Open Source', count('snyk-oss.sarif')),
              row('Code', count('snyk-code.sarif')),
              '',
              'Full details are in the **Security → Code scanning** tab.',
              '<!-- snyk-summary -->',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- snyk-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      # --- Gate: fail only after both scans ran and uploaded ---
      - name: Enforce security gate
        if: steps.oss.outcome == 'failure' || steps.code.outcome == 'failure'
        run: |
          echo "::error::Snyk found issues at or above '$SEVERITY', or a scan could not complete."
          exit 1
