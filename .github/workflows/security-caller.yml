name: security

on:
  push:
    branches: [ lirantal-patch-1 ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    uses: vipgit1/security-templates/.github/workflows/snyk-scan.yml@1ea286209e3064fffcb14291f458cf24c63f1530  # main, 2026-11-18
    with:
      severity-threshold: high
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
